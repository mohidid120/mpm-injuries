# Live injury report for the MPM site (docs/SITE_HOSTING.md in the model repo). Every 15 minutes, 11:00-02:00 ET
# (UTC windows cover both EST and EDT): fetch the latest official NBA injury report; when a newer snapshot appears,
# commit injuries.json here; the site reads it from raw.githubusercontent.com. No secrets needed.
name: injuries
on:
  schedule:
    - cron: '*/15 15-23 * * *'
    - cron: '*/15 0-7 * * *'
  workflow_dispatch:
concurrency: { group: injuries, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: python scrape.py injuries.json
      - name: Commit on change
        run: |
          if [ -z "$(git status --porcelain injuries.json)" ]; then echo "no new report"; exit 0; fi
          git config user.name "injury-bot"; git config user.email "injury-bot@users.noreply.github.com"
          git add injuries.json; git commit -m "injury report $(python -c 'import json;print(json.load(open("injuries.json"))["snapshot"])')"
          git push
